name: Deploy to GitHub Pages

# Put THIS FOLDER'S CONTENTS at the root of its own (public) GitHub repository,
# so this file ends up at .github/workflows/deploy-pages.yml.
# One-time setup:
#   1. Repo Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Repo Settings > Secrets and variables > Actions > "Variables" tab, add:
#        VITE_SUPABASE_URL              https://<project-ref>.supabase.co
#        VITE_SUPABASE_PUBLISHABLE_KEY  the sb_publishable_... key
#      (Variables, not secrets: the publishable key is public by design and is
#       baked into the built site anyway. Never add a service-role or secret key.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Work out the base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
